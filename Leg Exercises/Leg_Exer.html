<body>
    <div class="navbar">
        <div class="logo">
            <img src="/Images/MP_Logo.png" alt="Logo" width="100px" height="100px">
        </div>
        <div class="menu">
            <a href="/Homepage/Homepage.html">Home</a>
            <a href="/Navbar/Workouts.html">Workouts</a>
            <a href="/Navbar/About.html" class="active">About Us</a>

        <div class="join-now">

    <div class="content">
        <h1>LEG EXERCISES</h1>
        <p>Strengthen your legs with these beginner exercises.</p>
        
        <div class="exercise">
            <div class="exercise-info">
                <img src="/Images/Squats.png" alt="Squats Image" class="exercise-image">
                <a href="leg_exer_squats.html" class="exercise-name">BODYWEIGHT SQUATS</a>
            </div>
            <div class="exercise-input">
                <label for="squats-sets">SETS DONE :</label>
                <input type="number" id="squats-sets" placeholder="0">
            </div>
        </div>

        <div class="exercise">
            <div class="exercise-info">
                <img src="/Images/Lunges.png" alt="Lunges Image" class="exercise-image">
                <a href="leg_exer_lunges.html" class="exercise-name">LUNGES</a>
            </div>
            <div class="exercise-input">
                <label for="lunges-sets">SETS DONE :</label>
                <input type="number" id="lunges-sets" placeholder="0">
            </div>
        </div>

        <div class="exercise">
            <div class="exercise-info">
                <img src="/Images/CalfRaises.png" alt="Calf Raises Image" class="exercise-image">
                <a href="leg_exer_calfraises.html" class="exercise-name">CALF RAISES</a>
            </div>
            <div class="exercise-input">
                <label for="calf-raises-sets">SETS DONE :</label>
                <input type="number" id="calf-raises-sets" placeholder="0">
            </div>
        </div>
    </div>
    
    <script src="/Leg Exercises/Leg_Exer.js"></script>
