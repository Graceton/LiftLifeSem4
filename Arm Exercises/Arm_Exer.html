        <p>Arm exercises help build strength and muscle in your arms, enhancing overall upper body performance.</p>

        <div class="exercise">
            <div class="exercise-info">
                <img src="/Images/Bicepcurls.png" alt="Bicep Curls Image" class="exercise-image">

        </div>

            <div class="exercise-info">
                <img src="/Images/Tricep_dips.png" alt="Tricep Dips Image" class="exercise-image">
