<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Goals</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
            padding-top: 60px;
        }
        .navbar {
            background: linear-gradient(135deg, #1e81b0, #16607a);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }
        .logo img {
            width: 80px;
            border-radius: 50%;
        }
        .menu a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s ease-in-out;
        }
        .menu a:hover {
            color: #ffcc00;
        }
        .profile a {
            background-color: #ffcc00;
            padding: 10px 20px;
            color: black;
            font-weight: bold;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s ease-in-out;
        }
        .profile a:hover {
            background-color: #e6b800;
        }
        .header {
            background: linear-gradient(90deg, #ff7e5f, #feb47b);
            color: white;
            text-align: center;
            padding: 20px;
            border-radius: 10px;
            margin: 20px auto;
            max-width: 1200px;
        }
        .goal-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 1200px;
            margin: 20px auto;
        }
        .goal-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            width: 250px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .goal-card h3 {
            color: #ff7e5f;
            margin: 0 0 10px;
        }
        .goal-card p {
            color: #666;
            margin: 5px 0;
        }
        .progress-bar {
            width: 100%;
            background: #eee;
            border-radius: 5px;
            height: 20px;
            margin-top: 10px;
        }
        .progress {
            height: 100%;
            background: #ff7e5f;
            border-radius: 5px;
            transition: width 0.5s ease-in-out;
        }
        .add-goal-btn {
            background: #ff7e5f;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }
        .add-goal-btn:hover {
            background: #feb47b;
        }
        .form-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }
        .form-content {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 300px;
        }
        .form-content input, .form-content select, .form-content button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .form-content .toggle {
            margin: 10px 0;
        }
        .save-btn {
            background: #1e81b0;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
        }
        .save-btn:hover {
            background: #16607a;
        }
        .workout-history {
            margin-top: 20px;
            text-align: left;
        }
        .workout-history table {
            width: 100%;
            border-collapse: collapse;
        }
        .workout-history th, .workout-history td {
            padding: 10px;
            border: 1px solid #ddd;
        }
        .workout-history th {
            background: #1e81b0;
            color: white;
        }
    </style>
</head>
<body>
        <div class="navbar">
            <div class="logo">
                <img src="/Images/MP_Logo.png" alt="Logo">
            </div>
            <div class="menu">
                <a href="/Homepage/Homepage2.html">HOME</a>
                <a href="/Navbar/Workouts.html">WORKOUTS</a>
                <a href="/Navbar/Goals.html">GOALS</a>
                <a href="/NavBar/community.html">COMMUNITY</a>
                <a href="/Navbar/Settings.html">SETTINGS</a>
            </div>
            <div class="profile">
                <a href="/NavBar/Profile.html" id="profileButton">PROFILE</a>
                <a href="/NavBar/Notificatoin.html" id="profileButton">Set Notification</a>
            </div>
        </div>

    <div class="header">
        <h1>Your Fitness Goals</h1>
        <p>Track and achieve your fitness aspirations</p>
    </div>

    <div class="goal-container" id="goal-container">
        <!-- Goal cards will be dynamically added here -->
    </div>

    <button class="add-goal-btn" onclick="showForm()">Add New Goal</button>

    <div class="form-overlay" id="form-overlay">
        <div class="form-content">
            <h3>Add New Goal</h3>
            <input type="text" id="goal-name" placeholder="Goal Name" required>
            <select id="goal-type">
                <option value="fatloss">Fat Loss</option>
                <option value="musclegain">Muscle Gain</option>
                <option value="endurance">Endurance</option>
                <option value="custom">Custom</option>
            </select>
            <input type="number" id="target-sets" placeholder="Target Sets" required>
            <input type="number" id="target-reps" placeholder="Target Reps" required>
            <label class="toggle">
                <input type="checkbox" id="current-goal"> Set as Current Goal
            </label>
            <button onclick="saveGoal()">Save Goal</button>
            <button onclick="hideForm()">Cancel</button>
        </div>
    </div>

    <script>
        let goals = JSON.parse(localStorage.getItem('goals')) || [];
        let currentGoalIndex = localStorage.getItem('currentGoalIndex') || null;

        function showForm() {
            document.getElementById('form-overlay').style.display = 'flex';
        }

        function hideForm() {
            document.getElementById('form-overlay').style.display = 'none';
        }

        function saveGoal() {
            const name = document.getElementById('goal-name').value;
            const type = document.getElementById('goal-type').value;
            const targetSets = parseInt(document.getElementById('target-sets').value);
            const targetReps = parseInt(document.getElementById('target-reps').value);
            const isCurrent = document.getElementById('current-goal').checked;

            if (name && targetSets > 0 && targetReps > 0) {
                const goal = {
                    id: Date.now(),
                    name: name,
                    type: type,
                    targetSets: targetSets,
                    targetReps: targetReps,
                    setsDone: 0,
                    repsDone: 0,
                    history: []
                };
                goals.push(goal);
                if (isCurrent || currentGoalIndex === null) {
                    currentGoalIndex = goals.length - 1;
                    localStorage.setItem('currentGoalIndex', currentGoalIndex);
                }
                localStorage.setItem('goals', JSON.stringify(goals));
                renderGoals();
                hideForm();
                document.getElementById('goal-name').value = '';
                document.getElementById('target-sets').value = '';
                document.getElementById('target-reps').value = '';
                document.getElementById('current-goal').checked = false;
            }
        }

        function renderGoals() {
            const container = document.getElementById('goal-container');
            container.innerHTML = '';
            goals.forEach((goal, index) => {
                const card = document.createElement('div');
                card.className = 'goal-card';
                card.innerHTML = `
                    <h3>${goal.name}</h3>
                    <p>${goal.type}</p>
                    <p>Target: ${goal.targetSets} sets, ${goal.targetReps} reps</p>
                    <div class="progress-bar">
                        <div class="progress" style="width: ${calculateProgress(goal)}%"></div>
                    </div>
                    <p>${calculateProgress(goal).toFixed(1)}% Completed</p>
                    <button onclick="showGoalDetails(${index})">View Details</button>
                `;
                container.appendChild(card);
            });
        }

        function calculateProgress(goal) {
            const totalTarget = goal.targetSets * goal.targetReps;
            const totalDone = goal.setsDone * goal.repsDone;
            return totalTarget > 0 ? (totalDone / totalTarget) * 100 : 0;
        }

        function showGoalDetails(index) {
            const goal = goals[index];
            const container = document.getElementById('goal-container');
            container.innerHTML = `
                <div class="goal-card">
                    <h3>${goal.name}</h3>
                    <p>Goal: ${goal.type}</p>
                    <p>Target: ${goal.targetSets} sets, ${goal.targetReps} reps</p>
                    <p>Done: ${goal.setsDone} sets, ${goal.repsDone} reps</p>
                    <div class="progress-bar">
                        <div class="progress" style="width: ${calculateProgress(goal)}%"></div>
                    </div>
                    <p>${calculateProgress(goal).toFixed(1)}% Completed</p>
                    <div class="workout-history">
                        <h4>Workout History</h4>
                        <table>
                            <tr>
                                <th>Date</th>
                                <th>Sets</th>
                                <th>Reps</th>
                            </tr>
                            ${goal.history.map(h => `
                                <tr>
                                    <td>${new Date(h.date).toLocaleDateString()}</td>
                                    <td>${h.sets}</td>
                                    <td>${h.reps}</td>
                                </tr>
                            `).join('')}
                        </table>
                    </div>
                    <input type="number" id="sets-input" placeholder="Sets Done" min="0">
                    <input type="number" id="reps-input" placeholder="Reps Done" min="0">
                    <button onclick="saveToday(${index})">Save for Today</button>
                    <button onclick="renderGoals()">Back</button>
                </div>
            `;
        }

        function saveToday(index) {
            const sets = parseInt(document.getElementById('sets-input').value) || 0;
            const reps = parseInt(document.getElementById('reps-input').value) || 0;
            if (sets > 0 && reps > 0) {
                goals[index].setsDone += sets;
                goals[index].repsDone += reps;
                goals[index].history.push({ date: Date.now(), sets: sets, reps: reps });
                localStorage.setItem('goals', JSON.stringify(goals));
                showGoalDetails(index);
                document.getElementById('sets-input').value = '';
                document.getElementById('reps-input').value = '';
            }
        }

        renderGoals();
    </script>
    <script src="/js/loginCheck.js"></script>
    <script src="/js/linkRedirect.js"></script>
</body>
</html>
